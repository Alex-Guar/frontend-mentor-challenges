<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>time-tracking-dashboard</title>
</head>

<body>
  <main>
    <div class="dash-container">
      <div class="dash-wrapper">
        <div class="user">
          <section class="u-information">
            <img class="u-image" src="./src/assets/images/image-jeremy.png" alt="Face of Jeremy" />
            <div class="u-report">
              <p class="u-report-header">Report for </p>
              <h1 class="u-name">Jeremy Robson</h1>
            </div>
          </section>
          <div class="filter">
            <ul class="filter-options">
              <li><a id="daily">Daily</a></li>
              <li><a id="weekly">Weekly</a></li>
              <li><a id="monthly">Monthly</a></li>
            </ul>
          </div>
        </div>

        <div class="activity work">
          <div class="activity-portada work"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Work</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-work" datetime="PT32H">32hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-work" datetime="PT36H">36hrs</time></p>
            </div>
          </section>
        </div>

        <div class="activity play">
          <div class="activity-portada play"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Play</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-play" datetime="PT10H">10hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-play" datetime="PT8H">8hrs</time></p>
            </div>
          </section>
        </div>

        <div class="activity study">
          <div class="activity-portada study"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Study</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-study" datetime="PT4H">4hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-study" datetime="PT7H">7hrs</time></p>
            </div>
          </section>
        </div>

        <div class="activity exercise">
          <div class="activity-portada exercise"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Exercise</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-exercise" datetime="PT4H">4hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-exercise" datetime="PT5H">5hrs</time>
              </p>
            </div>
          </section>
        </div>

        <div class="activity social">
          <div class="activity-portada social"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Social</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-social" datetime="PT5H">5hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-social" datetime="PT10H">10hrs</time>
              </p>
            </div>
          </section>
        </div>

        <div class="activity self-care">
          <div class="activity-portada self-care"></div>
          <section class="activity-information">
            <header class="activity-header">
              <h2 class="activity-name">Self Care</h2>
              <img class="activity-icon" alt="ellipsis" src="./src/assets/images/icon-ellipsis.svg" />
            </header>
            <div class="activity-time">
              <p class="activity-time--current"><time id="current-self-care" datetime="PT2H">2hrs</time></p>
              <p class="activity-time--previous">Last Week - <time id="previous-self-care" datetime="PT1H">1hr</time>
              </p>
            </div>
          </section>
        </div>

      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
