<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>interactive-rating-component-main</title>
</head>

<body>
  <main>
    <div class="container_raiting">
      <form class="wrapper_raiting">
        <img alt="start" src="./src/assets/icon-star.svg" class="start" />
        <h1 class="raiting_title">How did we do?</h1>
        <p class="raiting_description">Please let us know how we did with your support
          request. All feedback is appreciated to help us improve
          our offering!</p>
        <ul class="raiting_options">
          <li>1</li>
          <li>2</li>
          <li>3</li>
          <li>4</li>
          <li>5</li>
        </ul>
        <button type="submit">SUBMIT</button>
      </form>
    </div>
  </main>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
