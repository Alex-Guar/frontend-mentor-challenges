<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tip-calculator-app</title>
</head>

<body>
  <main>
    <h1>SPLI TTER</h1>
    <div class="calculator_container">
      <form class="c_wrapper">

        <div class="c_setting">

          <section class="c_setting-bill">
            <label class="c_setting-bill-tag" for="bill">Bill</label>
            <div class="c_container_input">
              <i class="c_container_input-icon-bill" aria-hidden="true"></i>
              <input class="c_setting_input" type="number" id="bill" placeholder="0" />
            </div>
          </section>

          <div class="c_setting-tip">
            <legend>Select Tip %</legend>
            <div class="percentages-container">
              <button class="percentage" type="button">5%</button>
              <button class="percentage" type="button">10%</button>
              <button class="percentage" type="button">15%</button>
              <button class="percentage" type="button">25%</button>
              <button class="percentage" type="button">50%</button>
              <input class="percentage-custom" id="percentage" type="number" placeholder="Custom" />
            </div>
          </div>

          <section class="c_setting-numPeople">
            <label class="c_setting-numPeople-tag" for="numPeople">Number of People</label>
            <div class="c_container_input">
              <i class="c_container_input-icon-people" aria-hidden="true"></i>
              <input class="c_setting_input" id="numPeople" type="number" placeholder="0" />
            </div>
          </section>

        </div>

        <div class="c_display">
          <div class="c_display-results">
            <section class="c_display-result">
              <h2 class="c_display_result_title">Tip Amount</h2>
              <h3 class="c_display_result_subtitle">/ person</h3>
              <h4 class="c_display_result_total">$0.00</h4>
            </section>

            <section class="c_display-result">
              <h2 class="c_display_result_title">Total</h2>
              <h3 class="c_display_result_subtitle">/ person </h3>
              <h4 class="c_display_result_total">$0.00</h4>
            </section>
          </div>

          <input class="c_display_reset" type="reset" value="RESET" />

        </div>

      </form>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
