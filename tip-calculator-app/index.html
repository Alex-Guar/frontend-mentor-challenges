<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tip-calculator-app</title>
  <script type="module" crossorigin src="/frontend-mentor-challenges/tip-calculator-app/assets/index-CutP9lVz.js"></script>
  <link rel="stylesheet" crossorigin href="/frontend-mentor-challenges/tip-calculator-app/assets/index-BMRrKIQR.css">
</head>

<body>
  <main>
    <h1>SPLI TTER</h1>
    <div class="calculator_container">
      <form class="c_wrapper">

        <div class="c_setting">

          <section class="c_setting-bill">
            <label class="c_setting-bill-tag" for="bill">Bill</label>
            <div class="c_container_input" id="billContainer">
              <i class="c_container_input-icon-bill" aria-hidden="true"></i>
              <input class="c_setting_input" type="number" id="bill" placeholder="0" />
            </div>
          </section>

          <div class="c_setting-tip">
            <label>Select Tip %</label>
            <div class="percentages-container">
              <button class="percentage" type="button" value="5" id="percentage5">5%</button>
              <button class="percentage" type="button" value="10" id="percentage10">10%</button>
              <button class="percentage" type="button" value="15" id="percentage15">15%</button>
              <button class="percentage" type="button" value="25" id="percentage25">25%</button>
              <button class="percentage" type="button" value="50" id="percentage50">50%</button>
              <input class="percentage-custom" id="percentageCustom" type="number" placeholder="Custom" />
            </div>
          </div>

          <section class="c_setting-numPeople">
            <div class="c_setting-numPeople-tags">
              <label class="c_setting-numPeople-tag" for="numPeople">Number of People</label>
              <p class="c_setting-numPeople-errorTag" id="errorNumPeople">Can't be zero</p>
            </div>
            <div class="c_container_input" id="numPeopleContainer">
              <i class="c_container_input-icon-people" aria-hidden="true"></i>
              <input class="c_setting_input" id="numPeople" type="number" placeholder="0" min="0" />
            </div>
          </section>

        </div>

        <div class="c_display">
          <div class="c_display-results">
            <section class="c_display-result">
              <h2 class="c_display_result_title">Tip Amount</h2>
              <h3 class="c_display_result_subtitle">/ person</h3>
              <h4 class="c_display_result_total">
                $<span id="tipAmount">0.00</span></h4>
            </section>

            <section class="c_display-result">
              <h2 class="c_display_result_title">Total</h2>
              <h3 class="c_display_result_subtitle">/ person </h3>
              <h4 class="c_display_result_total">
                $<span id="total">0.00</span></h4>
            </section>
          </div>

          <input class="c_display_reset c_display_reset-incomplete" id="resetButton" type="reset" value="RESET" />

        </div>

      </form>
    </div>
  </main>
</body>

</html>
