<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product-preview-card-component</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <main> 
      <div class="containar">
        <div class="card">
          <img class="card__portada" alt="Perfume with plants" src="./src/assets/image-product-desktop.jpg" />
          <div class="card__content">
            <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
            <h2 class="card__subtitle">PERFUME</h2>
            <p class="card__description">A flor, solar and vouptuos interpretation
            composed by Oliver Polge, Perfumer-Creator
              for the House of CHANEL.</p> 
            <div class="card__price">
              <p class="card__price--available">$149.99</p>
              <p class="card__price--disable">$169.00</p>
            </div>
            <button class="card__button">Add to Cart</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
