<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product-preview-card-component</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <main> 
      <div class="container">
        <div class="card">
          <picture>
            <source 
              media="(width <= 27em)"
              srcset="./src/assets/image-product-mobile.jpg" />
            <img 
              class="card__portada" 
              alt="Perfume with plants" 
              src="./src/assets/image-product-desktop.jpg" />
          </picture>
          <div class="card__content">
            <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
            <h2 class="card__subtitle">PERFUME</h2>
            <p class="card__description">A floral, solar and vouptuos interpretation
            composed by Oliver Polge, Perfumer-Creator
              for the House of CHANEL.</p> 
            <div class="card__price">
              <p class="card__price--available">$149.99</p>
              <p class="card__price--disable">$169.00</p>
            </div>
            <button type="button" class="card__button">
              <img  class="button__image" src="src/assets/icon-cart.svg" />
              <span class="button__text">Add to Cart</span >
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
