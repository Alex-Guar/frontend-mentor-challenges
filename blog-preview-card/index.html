<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blog-previw-card</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <main>
      <div role="article" class="wrapper">
        <div class = "card">

          <img class = "card-poster"  alt="poster of head"
          src= "/src/assets/images/illustration-article.svg">

          <section class="card-info">
            <span class="card-status">
              Learning
            </span>
            <span class="card-date">
              Publish 21 Dec 2023
            </span>
          </section>

          <section class="card-details">
            <h1 class="card-detail-h1"> HTML & CSS foundations </h1>
            <p class="card-detail-description">
            These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
          </section>

          <section class="card-by">
            <img class="card-by-avatar"  alt="Represent the face of the creator"
              src="/src/assets/images/image-avatar.webp">
            <span class="card-by-name"> Greg Hooper </span>
          </section>

        </div>
      </div>    

    </body>
  </main>
</html>
